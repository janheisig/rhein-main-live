<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Public Transport Live</title>
<meta name="description" content="Live-Karte von Bahnen, Trams und Bussen mit Verspätungen, mit Liniennetz für das Rhein-Main-Gebiet.">
<meta name="theme-color" content="#10151b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PT Live">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#10151b; --panel:#171e26f2; --panel-solid:#171e26; --line:#2a3542;
    --ink:#e8edf2; --muted:#8c9aaa; --accent:#5ec8ff;
    --ok:#3ecf8e; --warn:#f5c542; --late:#ff8a3d; --bad:#ff4d5e;
    --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui)}
  #map{position:absolute;inset:0;background:var(--bg)}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:450}
  .leaflet-container{background:var(--bg);font-family:var(--ui)}
  .leaflet-control-attribution{background:#10151bcc!important;color:var(--muted)!important;font-size:10px}
  .leaflet-control-attribution a{color:#a9c4d8!important}
  .leaflet-bar a{background:var(--panel-solid);color:var(--ink);border-color:var(--line)!important}
  .leaflet-bar a:hover{background:#222c37}

  .card{position:absolute;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:10px;
        backdrop-filter:blur(8px);box-shadow:0 8px 28px #0007}
  #hud{top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:292px;max-width:calc(100vw - 24px);padding:14px 14px 12px}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h1{font:700 21px/1.05 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
  #clock{font:600 22px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
  .status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-top:6px}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:p 2s infinite}
  .pulse.err{background:var(--bad);animation:none}
  @keyframes p{0%{box-shadow:0 0 0 0 #3ecf8e88}70%{box-shadow:0 0 0 8px #3ecf8e00}100%{box-shadow:0 0 0 0 #3ecf8e00}}
  .lbl{font:600 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;
        padding:5px 9px;font:600 13px/1 var(--ui);cursor:pointer;display:flex;align-items:center;gap:6px}
  .chip .n{font-variant-numeric:tabular-nums;opacity:.75;font-weight:500}
  .chip[aria-pressed="true"]{background:#223040;color:var(--ink);border-color:#3d5064}
  .chip:focus-visible,.x:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sym{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:4px;font:700 12px/1 var(--display);color:#fff}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);padding:6px 8px;font:600 13px/1 var(--ui);cursor:pointer}
  .seg button[aria-pressed="true"]{background:#223040;color:var(--ink)}
  #q{width:100%;box-sizing:border-box;background:#0f141a;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:7px 9px;font:500 13px var(--ui)}
  #q::placeholder{color:#5f6d7c}
  .dynnote{margin-top:8px;font-size:12px;color:var(--muted);line-height:1.4}
  .linkbtn{appearance:none;border:0;background:none;color:var(--accent);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
  .stat b{display:block;font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted)}
  .bar{height:6px;border-radius:3px;background:#0f141a;overflow:hidden;display:flex;margin-top:10px}
  .bar i{display:block;height:100%}
  #worst{list-style:none;margin:0;padding:0;display:grid;gap:3px}
  #worst li{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:13px}
  #worst li:hover{background:#ffffff0d}
  #worst .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  #worst .d{font:700 15px/1 var(--display);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  #toggle{display:none}

  #info{top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:320px;max-width:calc(100vw - 24px);max-height:calc(100% - 90px);
        display:flex;flex-direction:column;overflow:hidden}
  .ih{flex:0 0 auto;padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  .ih .big{font:700 22px/1 var(--display);padding:5px 8px;border-radius:6px;min-width:26px;text-align:center}
  .ih .dir{flex:1;min-width:0}
  .ih .dir b{display:block;font:600 16px/1.2 var(--ui)}
  .ih .dir span{font-size:12px;color:var(--muted)}
  .x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 4px}
  .delaybox{flex:0 0 auto;padding:10px 14px;display:flex;gap:16px;border-bottom:1px solid var(--line)}
  .delaybox div b{display:block;font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
  .delaybox div span{font-size:11px;color:var(--muted)}
  #stops{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 0 10px;margin:0;list-style:none}
  #stops li{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;padding:4px 14px;font-size:13px}
  #stops li .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);justify-self:center}
  #stops li.past{color:#5f6d7c}
  #stops li.past .dot{background:#5f6d7c;border-color:#5f6d7c}
  #stops li.next{font-weight:600}
  #stops li.next .dot{background:var(--accent);border-color:var(--accent)}
  #stops .tm{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  #stops .tm s{color:#5f6d7c;margin-right:5px}
  .note{padding:10px 14px;color:var(--muted);font-size:12px}

  #locate{position:absolute;z-index:900;right:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:34px;height:34px;
          border-radius:6px;border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
  #locate[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
  #locate svg{width:18px;height:18px}
  .leaflet-bottom{margin-bottom:env(safe-area-inset-bottom,0px)}
  @media (max-width:640px){
    #hud{width:auto;right:12px;padding:10px 12px;max-height:calc(100% - 110px - env(safe-area-inset-top,0px));overflow:auto}
    #hud.collapsed{overflow:hidden}
    #hud.collapsed .body{display:none}
    #toggle{display:block;position:absolute;right:6px;top:4px;font-size:22px;padding:8px 10px}
    #hud .head{padding-right:40px}
    h1{font-size:19px}
    #clock{font-size:19px}
    .chip{padding:8px 11px;font-size:14px}
    .seg button{padding:9px 8px;font-size:14px}
    #q{font-size:16px;padding:9px 10px}
    #worst li{padding:8px 6px}
    #info{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:8px;right:8px;width:auto;max-height:48%}
    .x{font-size:26px;padding:4px 8px}
    #locate{width:44px;height:44px;bottom:calc(104px + env(safe-area-inset-bottom,0px))}
    .leaflet-bar a{width:44px!important;height:44px!important;line-height:44px!important}
  }
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="fx"></canvas>

<section id="hud" class="card" aria-label="Steuerung">
  <button class="x" id="toggle" aria-label="Panel ein-/ausklappen">☰</button>
  <div class="head"><h1>Public Transport Live</h1><span id="clock">--:--:--</span></div>
  <div class="status"><span class="pulse" id="dot"></span><span id="st">Lade Echtzeitdaten …</span></div>
  <div class="body">
    <div class="lbl">Verkehrsmittel</div>
    <div class="chips" id="modes"></div>
    <div class="lbl">Ebenen</div>
    <div class="chips">
      <button class="chip" id="lyNet" aria-pressed="true">Liniennetz</button>
      <button class="chip" id="lyStations" aria-pressed="true">Stationen</button>
      <button class="chip" id="lyLabels" aria-pressed="true">Namen</button>
    </div>
    <div class="dynnote"><span id="dynCount">Außerhalb von Rhein-Main zeichnet sich das Netz beim Zuschauen selbst.</span> <button class="linkbtn" id="dynReset">Zurücksetzen</button></div>
    <div class="lbl">Einfärbung</div>
    <div class="seg" id="colorMode">
      <button id="cmLine" aria-pressed="true">Linienfarbe</button>
      <button id="cmDelay" aria-pressed="false">Verspätung</button>
    </div>
    <div class="lbl">Linien filtern</div>
    <input id="q" placeholder="z. B. U4, S8, 11" autocomplete="off">
    <div class="lbl">Jetzt unterwegs</div>
    <div class="stats">
      <div class="stat"><b id="sN">–</b><span>Fahrzeuge</span></div>
      <div class="stat"><b id="sP">–</b><span>pünktlich &lt;3′</span></div>
      <div class="stat"><b id="sA">–</b><span>Ø Verspätung</span></div>
    </div>
    <div class="bar" id="bar"></div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>&lt; 1 min</span>
      <span><i style="background:var(--warn)"></i>1–3</span>
      <span><i style="background:var(--late)"></i>3–6</span>
      <span><i style="background:var(--bad)"></i>&gt; 6 min</span>
    </div>
    <div class="lbl">Größte Verspätungen</div>
    <ul id="worst"></ul>
  </div>
</section>

<section id="info" class="card" hidden aria-live="polite"></section>
<button id="locate" aria-pressed="false" aria-label="Mein Standort" title="Mein Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>

async function load() {

// ---------- position of a trip right now ----------

  for (const i of vis) { const d = Math.max(0, i.v.delay); sum += d; buckets[d < 1 ? 0 : d < 3 ? 1 : d < 6 ? 2 : 3]++; }
  $("sN").textContent = list.length;
  $("sP").textContent = vis.length ? Math.round(100 * (buckets[0] + buckets[1]) / vis.length) + " %" : "–";
  $("sA").textContent = vis.length ? (sum / vis.length).toFixed(1).replace(".", ",") + "′" : "–";
  const cols = ["var(--ok)", "var(--warn)", "var(--late)", "var(--bad)"];
  $("bar").innerHTML = vis.length ? buckets.map((b, k) => `<i style="width:${100 * b / vis.length}%;background:${cols[k]}"></i>`).join("") : "";

  const worst = vis.filter(i => i.v.delay >= 2).sort((a, b) => b.v.delay - a.v.delay).slice(0, 6);
  $("worst").innerHTML = worst.length ? "" : `<li style="cursor:default;color:var(--muted)">Keine nennenswerten Verspätungen im Bild.</li>`;
  for (const i of worst) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="sym" style="background:${i.t.color};color:${textOn(i.t.color)};padding:0 4px"></span><span class="t"></span><span class="d" style="color:${delayColor(i.v.delay)}">+${Math.round(i.v.delay)}</span>`;
    li.children[0].textContent = i.t.line;
    li.children[1].textContent = "→ " + cleanName(i.v.next);
    li.onclick = () => { map.flyTo([i.v.lat, i.v.lng], Math.max(map.getZoom(), 14), {duration: .8}); select(i.t); };
    $("worst").appendChild(li);
  }
  if (selected) updateInfoLive(now);
}

function buildModes() {
  const sm = store.get("modes", null); if (sm) MODES.forEach(m => { if (m.key in sm) m.on = !!sm[m.key]; });
  const sl = store.get("layers", null); if (sl) Object.assign(layers, sl);
  const sc = store.get("colorBy", null); if (sc) colorBy = sc;
  const box = $("modes");
  for (const m of MODES) {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.m = m.key; b.setAttribute("aria-pressed", m.on);
    b.innerHTML = `<span class="sym" style="background:${m.col}">${m.sym}</span>${m.label}<span class="n">0</span>`;
    b.onclick = () => { m.on = !m.on; b.setAttribute("aria-pressed", m.on); syncNet(); store.set("modes", Object.fromEntries(MODES.map(x => [x.key, x.on]))); };
    box.appendChild(b);
  }
  $("cmLine").setAttribute("aria-pressed", colorBy === "line"); $("cmDelay").setAttribute("aria-pressed", colorBy === "delay");
  $("cmLine").onclick = () => { colorBy = "line"; store.set("colorBy", colorBy); $("cmLine").setAttribute("aria-pressed", true); $("cmDelay").setAttribute("aria-pressed", false); };
  $("cmDelay").onclick = () => { colorBy = "delay"; store.set("colorBy", colorBy); $("cmDelay").setAttribute("aria-pressed", true); $("cmLine").setAttribute("aria-pressed", false); };
  $("q").oninput = e => {
    const parts = e.target.value.toUpperCase().split(/[\s,;]+/).filter(Boolean);
    lineFilter = parts.length ? new Set(parts) : null;
    // switch on the mode of a typed line automatically
    if (lineFilter) for (const t of trips.values()) if (lineFilter.has(t.line.toUpperCase()) && !t.mode.on) {
      t.mode.on = true; document.querySelector(`[data-m="${t.mode.key}"]`).setAttribute("aria-pressed", true); syncNet();
    }
  };
  $("toggle").onclick = () => $("hud").classList.toggle("collapsed");
  $("dynReset").onclick = () => { if (confirm("Selbst gezeichnetes Liniennetz auf diesem Gerät löschen?")) { resetDyn(); stats([], Date.now()); } };
  for (const [id, key] of [["lyNet", "net"], ["lyStations", "stations"], ["lyLabels", "labels"]]) {
    $(id).onclick = () => { layers[key] = !layers[key]; $(id).setAttribute("aria-pressed", layers[key]); if (key === "net") syncNet(); store.set("layers", layers); };
    $(id).setAttribute("aria-pressed", layers[key]);
  }
  if (matchMedia("(max-width:640px)").matches) $("hud").classList.add("collapsed");
}

// ---------- selection / trip details ----------
let detail = null;
async function select(t) {
  selected = t; detail = null;
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  renderInfo(); $("info").hidden = false; $("info").scrollTop = 0;
  try {
    const r = await fetch(`${API}/v5/trip?tripId=${encodeURIComponent(t.id)}`);
    if (!r.ok) throw new Error();
    const d = await r.json(); const leg = d.legs && d.legs[0];
    if (!leg || selected !== t) return;
    detail = leg;
    if (leg.legGeometry && leg.legGeometry.points) {
      const pts = decodePolyline(leg.legGeometry.points, leg.legGeometry.precision || 6);
      routeLayer = L.polyline(pts, {color: t.color, weight: 5, opacity: .55}).addTo(map);
    }
    renderInfo();
  } catch { if (selected === t) { detail = {error: true}; renderInfo(); } }
}
function deselect() { selected = null; detail = null; $("info").hidden = true; $("info").innerHTML = ""; if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; } }

function renderInfo() {
  const t = selected; if (!t) return;
  const v = vehicleNow(t, Date.now()) || {};
  const head = detail && detail.headsign ? cleanName(detail.headsign) : "Ziel wird geladen …";
  const el = $("info");
  el.innerHTML = `
    <div class="ih">
      <span class="big" style="background:${t.color};color:${textOn(t.color)}"></span>
      <div class="dir"><b id="iHead"></b><span id="iSub"></span></div>
      <button class="x" id="iClose" aria-label="Schließen">×</button>
    </div>
    <div class="delaybox">
      <div><b id="iDelay">–</b><span>Verspätung</span></div>
      <div style="min-width:0"><b id="iNext" style="font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">–</b><span id="iNextL">Nächster Halt</span></div>
    </div>
    <ol id="stops"></ol>`;
  el.querySelector(".big").textContent = t.line;
  $("iHead").textContent = "→ " + head;
  $("iSub").textContent = t.mode.label + (detail && detail.agencyName ? " · " + detail.agencyName : "");
  $("iClose").onclick = deselect;
  if (detail && detail.error) $("stops").outerHTML = `<div class="note">Fahrtverlauf konnte nicht geladen werden.</div>`;
  else if (detail) {
    const all = [detail.from, ...(detail.intermediateStops || []), detail.to];
    const ol = $("stops");
    for (const s of all) {
      const tReal = t2ms(s.departure || s.arrival), tPlan = t2ms(s.scheduledDeparture || s.scheduledArrival);
      const li = document.createElement("li"); li.dataset.t = tReal;
      const late = Math.round((tReal - tPlan) / 60000);
      li.innerHTML = `<span class="dot"></span><span class="nm"></span><span class="tm"></span>`;
      li.querySelector(".nm").textContent = cleanName(s.name) + (s.cancelled ? " (entfällt)" : "");
      li.querySelector(".tm").innerHTML = late >= 1
        ? `<s>${hhmm(tPlan)}</s><span style="color:${delayColor(late)}">${hhmm(tReal)}</span>`
        : hhmm(tReal);
      ol.appendChild(li);
    }
  } else $("stops").outerHTML = `<div class="note">Lade Fahrtverlauf …</div>`;
  updateInfoLive(Date.now(), v, true);
}
function updateInfoLive(now, v, scroll) {
  const t = selected; if (!t || !$("iDelay")) return;
  v = v || vehicleNow(t, now);
  if (!v) { $("iDelay").textContent = "–"; $("iNext").textContent = "Fahrt beendet"; return; }
  const d = v.rt ? Math.round(Math.max(0, v.delay)) : null;
  $("iDelay").textContent = d == null ? "Plan" : d === 0 ? "pünktlich" : "+" + d + " min";
  $("iDelay").style.color = delayColor(d);
  $("iNext").textContent = cleanName(v.at && !v.moving ? v.at : v.next);
  $("iNextL").textContent = v.at && !v.moving ? "Steht an" : "Nächster Halt";
  let nextMarked = false;
  document.querySelectorAll("#stops li").forEach(li => {
    const past = +li.dataset.t < now - 20000;
    li.classList.toggle("past", past);
    const isNext = !past && !nextMarked; li.classList.toggle("next", isNext);
    if (isNext) { nextMarked = true; if (scroll) { const ol = $("stops"); ol.scrollTop = Math.max(0, li.offsetTop - ol.offsetTop - ol.clientHeight / 2); } }
  });
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && selected) deselect(); });
map.on("click", e => {
  const p = e.containerPoint; let best = null, bd = 1e9;
  for (const d of drawn) { const dd = Math.hypot(d.x - p.x, d.y - p.y); if (dd < d.r + (touch ? 10 : 0) && dd < bd) { bd = dd; best = d; } }
  if (best) select(best.t); else deselect();
});
map.on("mousemove", e => {
  const p = e.containerPoint;
  map.getContainer().style.cursor = drawn.some(d => Math.hypot(d.x - p.x, d.y - p.y) < d.r) ? "pointer" : "";
});
let mvTimer; map.on("moveend", () => { clearTimeout(mvTimer); mvTimer = setTimeout(load, 400); });

buildModes();
styleNet(); syncNet();
load();
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

// ---------- my location ----------
let me = null, meWatch = null;
$("locate").onclick = () => {
  if (meWatch != null) {
    navigator.geolocation.clearWatch(meWatch); meWatch = null;
    if (me) { map.removeLayer(me.dot); map.removeLayer(me.acc); me = null; }
    $("locate").setAttribute("aria-pressed", false); return;
  }
  if (!navigator.geolocation) return;
  $("locate").setAttribute("aria-pressed", true);
  let first = true;
  meWatch = navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (!me) me = {
      acc: L.circle(ll, {radius: pos.coords.accuracy, color: "#5ec8ff", weight: 1, fillOpacity: .08, interactive: false}).addTo(map),
      dot: L.circleMarker(ll, {radius: 7, color: "#fff", weight: 2.5, fillColor: "#2f8fff", fillOpacity: 1, interactive: false}).addTo(map)
    };
    me.dot.setLatLng(ll); me.acc.setLatLng(ll).setRadius(pos.coords.accuracy);
    if (first) { map.flyTo(ll, Math.max(map.getZoom(), 15), {duration: .8}); first = false; }
  }, () => {
    $("locate").setAttribute("aria-pressed", false); meWatch = null;
    $("st").textContent = "Standort nicht verfügbar. Bitte Standortfreigabe für diese Seite erlauben.";
  }, {enableHighAccuracy: true, maximumAge: 10000});
};
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
})();
</script>
</body>
